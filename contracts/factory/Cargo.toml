[package]
name = "escrow-factory"
version = "0.1.0"
edition = "2021"
publish = false
description = "Soroban factory that deploys and indexes Escrow instances"

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
