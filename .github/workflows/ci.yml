name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soroban:
    name: Soroban (test, clippy, fmt)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install stellar CLI
        run: |
          curl -sSL -o /tmp/stellar-cli.tar.gz \
            https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli-27.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo install -m 755 /tmp/stellar /usr/local/bin/stellar

      - name: Build contracts
        run: |
          stellar contract build --manifest-path contracts/escrow/Cargo.toml
          stellar contract build --manifest-path contracts/factory/Cargo.toml

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  test-evm:
    name: Test EVM contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-evm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts-evm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests with gas report
        run: REPORT_GAS=true npx hardhat test

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          node-version: 20
          target: contracts-evm
          sarif: results.sarif
          fail-on: none
          slither-args: --exclude-dependencies

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
