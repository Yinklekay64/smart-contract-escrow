name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-evm:
    name: Test EVM contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts-evm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts-evm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests with gas report
        run: REPORT_GAS=true npx hardhat test

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        id: slither
        with:
          node-version: 20
          target: contracts-evm
          sarif: results.sarif
          fail-on: none
          slither-args: --exclude-dependencies

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
